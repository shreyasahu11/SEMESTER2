<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .box{
            border:2px solid black;
            padding:20px;
            margin-bottom:10px;
            text-align:center;
        }

        .big-box{
            height:250px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

    </style>
</head>

<body>

<div class="container mt-3">

    <!-- Logo and Navigation -->

    <div class="row box">

        <div class="col-lg-6 text-start">
            <h3>Logo</h3>
        </div>

        <div class="col-lg-6 text-end">
            <h3>Navigation</h3>
        </div>

    </div>

    <!-- Header / Banner -->

    <div class="row box">

        <div class="col-lg-12">
            <h3>Header / Banner</h3>
        </div>

    </div>

    <!-- Intro Text Area -->

    <div class="row box">

        <div class="col-lg-12">
            <h3>Intro Text Area</h3>
        </div>

    </div>

    <!-- Three Boxes -->

    <div class="row text-center mb-2">

        <div class="col-lg-4">
            <div class="box big-box">
                <h3>Box 1</h3>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="box big-box">
                <h3>Box 2</h3>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="box big-box">
                <h3>Box 3</h3>
            </div>
        </div>

    </div>

    <!-- Footer -->

    <div class="row box">

        <div class="col-lg-12">
            <h3>Footer</h3>
        </div>

    </div>

</div>

</body>
</html>
