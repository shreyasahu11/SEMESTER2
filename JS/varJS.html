<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title> JAVA SCRIPT</title>
</head>
<body>
    <script>
        //JS Variables-- contains either value or not..
        var myName="shreya";
        document.write(myName);
        console.log(myName);

         var myName="subhas";
         console.log(myName);

        function demo(){
            var msg="Hello ABES";
            console.log(msg);
        }
        demo();
        //variable declaring using let and const
        let myNumber= 12345;
        console.log(myNumber);

         myNumber=67890;// no redeclare but reassign
         console.log(myNumber);

        const myEmail="shreya123@gmail.com";
        console.log(myEmail);
        //myEmail="shreya345@gmail.com" // no redeclaration no reassignment
        console.log(myEmail);
        //JS execution
        //JS Scope
        //variable declaration
        //difference among car, let & const

    </script>
</body>
</html>
