<!DOCTYPE html>

    <title> FUNCTIONS IN JS</title>

<body>
    <script>
        //function:- block of code used or defined to perform specific tasks
        //Types of Functions
            //Normal function:- with parameter, without para,and with default

                //normal fn without parameters.
                function demo(){
                    console.log("hello JS");
                }
                demo();//function calling

                //with parameters..
                function demo1(text){
                    console.log("hello"+text);
                }
                demo1("react");
                // default parametes 
                function add(a,b){
                    console.log("addition is " + (a+b));
                }
                add(1,2);

               
                //anonymous function:

                //arrowfunction using multiple lines

                let msg2=(a,b)=>{
                    var num1=a;
                    var num2=b;
                    var res=num1/num2;
                    console.log("result is "+ res);
                }
                msg2(4,2);
    //IIFE:- an IIFE (immediately invoked function expression) is a JavaScript function that runs as soon as it is defined
    














































let num=[4,6,7,8,9,3,2,1];

//map
let square=num.map(n=>n*n)
console.log(square);

let sum=num.reduce((total,n)=>total+n);
console.log(sum);

let sorting=num.filter(n=>n>2);
console.log(sorting);
